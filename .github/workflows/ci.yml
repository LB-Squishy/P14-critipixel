name: Tests

on:
    push:
        branches: [preprod]
    pull_request:
        branches: [preprod]

jobs:
    coding-standards:
        name: Vérification de la qualité du code (PHP-CS-Fixer)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Installation de PHP et des extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: mbstring, intl
                  coverage: none

            - name: Installer Composer
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Vérifier la qualité du code
              run: composer cs:check

    static-analysis:
        name: Analyse statique (PHPStan)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Installation de PHP et des extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: mbstring, intl, pdo_mysql
                  coverage: none

            - name: Installer Composer
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Warmup cache Symfony
              run: php bin/console cache:warm --env=dev

            - name: Exécuter PHPStan
              run: composer stan-test

    test:
        name: Exécution des tests unitaires et fonctionnels (PHPUnit)
        runs-on: ubuntu-latest
        needs: [coding-standards, static-analysis]

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: ""
                    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
                    MYSQL_DATABASE: criti-pixel
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping --silent"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        steps:
            - uses: actions/checkout@v4

            - name: Installation de PHP et des extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: mbstring, intl, pdo_mysql, zip, gd
                  coverage: none

            - name: Installer Composer
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Récupérer le .env de test
              run: cp .env.test .env.test.local

            - name: Attendre que MySQL soit prêt
              run: |
                  until mysqladmin ping -h 127.0.0.1 -u root --silent; do
                    echo "Waiting for MySQL to be ready..."
                    sleep 5
                  done

            - name: Compiler SASS
              run: composer sass-build

            - name: Préparer la base de données de test et exécuter les tests
              run: composer test
