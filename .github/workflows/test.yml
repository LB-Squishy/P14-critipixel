name: Tests

on:
    push:
        branches: [preprod]
    pull_request:
        branches: [preprod]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: ""
                    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
                    MYSQL_DATABASE: criti-pixel
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping --silent"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        steps:
            - uses: actions/checkout@v4

            - name: Installation de PHP et des extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: mbstring, intl, pdo_mysql, zip, gd
                  coverage: none

            - name: Installer Composer
              run: composer install --prefer-dist --no-progress --no-suggest --no-interaction

            - name: Compiler SASS
              run: php bin/console sass:build

            - name: Récupérer le .env de test
              run: cp .env.test .env.test.local

            - name: Attendre que MySQL soit prêt
              run: |
                  until mysqladmin ping -h 127.0.0.1 -u root --silent; do
                    echo "Waiting for MySQL to be ready..."
                    sleep 5
                  done

            - name: Créer la BDD de test
              run: php bin/console doctrine:database:create --env=test --if-not-exists

            - name: Exécuter les migrations
              run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

            - name: Importer les données de test
              run: |
                  mysql -h 127.0.0.1 -u root criti-pixel < criti-pixel_test.sql

            - name: Exécuter les tests
              run: php bin/phpunit --testdox --colors=always
